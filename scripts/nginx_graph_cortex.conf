# Nginx reverse proxy configuration for GraphCortex MCP Server
# Place this at: /etc/nginx/sites-available/graph-cortex
# Enable with: ln -s /etc/nginx/sites-available/graph-cortex /etc/nginx/sites-enabled/
# Then run: certbot --nginx -d demo.yourdomain.com

server {
    listen 80;
    server_name demo.yourdomain.com;

    location / {
        proxy_pass http://127.0.0.1:8000;

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CRITICAL: Disable buffering for Model Context Protocol (MCP) Server-Sent Events (SSE)
        # Without these lines, streaming tool calls will hang or freeze in Claude Desktop/Cursor
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
