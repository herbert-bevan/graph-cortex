version: "3.8"

services:
  app:
    build: .
    container_name: graphcortex-mcp-server
    restart: unless-stopped
    ports:
      # Bind to localhost only so it's private and proxied securely by your host Nginx
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    environment:
      - FALKORDB_HOST=falkordb
      - FALKORDB_PORT=6379
      - FALKORDB_PASSWORD=${FALKORDB_PASSWORD:-super_secure_falkor_password}
      - FALKORDB_GRAPH=${FALKORDB_GRAPH:-graphcortex_production}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-mcp_admin}:${POSTGRES_PASSWORD:-super_secure_pg_password}@postgres:5432/${POSTGRES_DB:-graphcortex_auth_db}
      - MAX_CONCURRENT_GUESTS=${MAX_CONCURRENT_GUESTS:-50}
      - GUEST_SESSION_LIMIT=${GUEST_SESSION_LIMIT:-10}
      - GUEST_TTL_HOURS=${GUEST_TTL_HOURS:-24}
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    depends_on:
      postgres:
        condition: service_healthy
      falkordb:
        condition: service_started

  falkordb:
    image: falkordb/falkordb:latest
    container_name: graphcortex-falkordb
    restart: unless-stopped
    command: ["falkordb-server", "--requirepass", "${FALKORDB_PASSWORD:-super_secure_falkor_password}"]
    expose:
      - "6379"
    volumes:
      - falkordb_data:/var/lib/falkordb/data

  postgres:
    image: postgres:16-alpine
    container_name: graphcortex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mcp_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-super_secure_pg_password}
      POSTGRES_DB: ${POSTGRES_DB:-graphcortex_auth_db}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_guest_db.sql:/docker-entrypoint-initdb.d/init_guest_db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mcp_admin} -d ${POSTGRES_DB:-mcp_auth_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  falkordb_data:
  postgres_data:
