version: "3.8"

services:
  app:
    build: .
    container_name: graphcortex-mcp-server
    restart: unless-stopped
    ports:
      # Privately accessible to host Nginx reverse proxy
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    environment:
      - FALKORDB_HOST=${FALKORDB_HOST:-falkordb}
      - FALKORDB_PORT=${FALKORDB_PORT:-6379}
      - FALKORDB_USERNAME=${FALKORDB_USERNAME:-}
      - FALKORDB_PASSWORD=${FALKORDB_PASSWORD}
      - FALKORDB_GRAPH=${FALKORDB_GRAPH:-graphcortex}
      - DATABASE_URL=${DATABASE_URL}
      - SQLITE_DIR=/app/data
      - MAX_CONCURRENT_GUESTS=${MAX_CONCURRENT_GUESTS:-50}
      - GUEST_SESSION_LIMIT=${GUEST_SESSION_LIMIT:-10}
      - GUEST_TTL_HOURS=${GUEST_TTL_HOURS:-24}
    volumes:
      - guest_db_data:/app/data
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    depends_on:
      - falkordb

  falkordb:
    image: falkordb/falkordb:latest
    container_name: graphcortex-falkordb
    restart: unless-stopped
    command: ["falkordb-server", "--requirepass", "${FALKORDB_PASSWORD}"]
    expose:
      - "6379"
    volumes:
      - falkordb_data:/var/lib/falkordb/data

volumes:
  falkordb_data:
  guest_db_data:
